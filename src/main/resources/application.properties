# Spring Boot Application Properties
spring.application.name=urban-drone-delivery

# =================================================================
# MYSQL DATABASE CONFIGURATION
# =================================================================
# Ensure MySQL server is running on localhost:3306
spring.datasource.url=jdbc:mysql://localhost:3306/urban_drone_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

# -----------------------------------------------------------------
# ENTER YOUR MYSQL ROOT PASSWORD BELOW:
# -----------------------------------------------------------------
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Auto DDL Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Port
server.port=8080
