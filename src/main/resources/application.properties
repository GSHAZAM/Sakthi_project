# Spring Boot Application Properties
spring.application.name=urban-drone-delivery

# =================================================================
# 1. DEFAULT ACTIVE DATABASE: H2 IN-MEMORY (WORKS INSTANTLY OUT-OF-THE-BOX)
# =================================================================
spring.datasource.url=jdbc:h2:mem:urban_drone_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =================================================================
# 2. MYSQL DATABASE CONFIGURATION (TO SWITCH TO MYSQL):
# To use MySQL:
#  a) Comment out the 5 H2 lines above
#  b) Uncomment the 5 MySQL lines below
#  c) Replace YOUR_MYSQL_PASSWORD with your actual MySQL root password
# =================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/urban_drone_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Auto DDL Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Port
server.port=8080
