# Spring Boot Application Properties
spring.application.name=urban-drone-delivery

# =================================================================
# 1. DATABASE CONFIGURATION (H2 EMBEDDED - WORKS INSTANTLY OUT-OF-THE-BOX)
# =================================================================
spring.datasource.url=jdbc:h2:mem:urban_drone_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =================================================================
# 2. MYSQL DATABASE CONFIGURATION (OPTIONAL)
# To switch to MySQL:
# 1) Comment out the H2 lines above
# 2) Uncomment the 4 MySQL lines below
# 3) Replace YOUR_MYSQL_PASSWORD with your actual MySQL password
# =================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/urban_drone_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Configuration
server.port=8080
