<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urban Drone Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card shadow-lg">
                    <div class="auth-header">
                        <div class="d-inline-flex p-3 rounded-circle bg-info bg-opacity-20 text-info mb-3">
                            <i class="fa-solid fa-drone fa-2x"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Urban Drone Network</h4>
                        <p class="text-light opacity-75 small mb-0">Sign in to your account</p>
                    </div>
                    <div class="card-body p-4 p-md-5">

                        <!-- Notifications -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@urbandrone.com or customer@gmail.com" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Sign In</button>
                        </form>

                        <div class="bg-light p-3 rounded-3 text-start mb-3 border">
                            <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-key text-warning me-1"></i> Demo Credentials:</h6>
                            <div class="small text-muted mb-1"><strong>Admin:</strong> <code>admin@urbandrone.com</code> / <code>admin123</code></div>
                            <div class="small text-muted"><strong>Customer:</strong> <code>customer@gmail.com</code> / <code>customer123</code></div>
                        </div>

                        <div class="text-center pt-2">
                            <p class="text-muted mb-0">Don't have an account? <a href="/register" class="fw-bold text-primary text-decoration-none">Register here</a></p>
                            <p class="mt-2 mb-0"><a href="/" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
