<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile - Urban Drone Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <a href="/customer/dashboard" class="sidebar-brand">
            <i class="fa-solid fa-drone"></i>
            <span>UrbanDrone Portal</span>
        </a>
        <nav class="nav flex-column">
            <a href="/customer/dashboard" class="nav-link-custom"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/customer/packages" class="nav-link-custom"><i class="fa-solid fa-box"></i> My Packages</a>
            <a href="/tracking" class="nav-link-custom"><i class="fa-solid fa-location-dot"></i> Package Tracking</a>
            <a href="/customer/profile" class="nav-link-custom active"><i class="fa-solid fa-user-gear"></i> Profile Settings</a>
        </nav>
        <div class="mt-auto pt-4 border-top border-white border-opacity-10">
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-outline-light w-100 btn-sm text-start"><i class="fa-solid fa-right-from-bracket me-2"></i> Log Out</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-navbar">
            <h4 class="fw-bold mb-0">Account Profile &amp; Settings</h4>
        </header>

        <!-- Notifications -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-white p-4 border-bottom">
                        <h5 class="fw-bold mb-0"><i class="fa-solid fa-id-card text-primary me-2"></i> Personal Details</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/customer/profile}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address (Account Identifier)</label>
                                <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="name" class="form-control" th:value="${user.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phone" class="form-control" th:value="${user.phone}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">New Password (leave blank to keep current)</label>
                                <input type="password" name="newPassword" class="form-control" placeholder="Enter new password">
                            </div>
                            <button type="submit" class="btn btn-primary fw-bold px-4"><i class="fa-solid fa-floppy-disk me-2"></i> Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
